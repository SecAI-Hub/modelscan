name: Verify, Build, and Publish Release to PyPI

on:
  push:
    tags:
      - v*

permissions: {}

jobs:
  release-gate:
    name: Verify release provenance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require an annotated SemVer tag on main
        run: |
          python - <<'PY'
          import os
          import re
          import sys

          tag = os.environ["GITHUB_REF_NAME"]
          semver = re.compile(
              r"^v(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)"
              r"(?:-(?:0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)"
              r"(?:\.(?:0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))*)?$"
          )
          if semver.fullmatch(tag) is None:
              print(f"release tag is not strict SemVer: {tag!r}", file=sys.stderr)
              sys.exit(1)
          PY
          test "$(git cat-file -t "$GITHUB_REF")" = tag
          test "$(git cat-file -p "$GITHUB_REF" | sed -n '2s/^type //p')" = commit
          test "$(git rev-parse "$GITHUB_REF^{}")" = "$(git rev-parse HEAD)"
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD origin/main

  release-tests:
    name: Test Python ${{ matrix.python-version }}
    needs: release-gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Poetry
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1.4.2
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true
      - name: Verify lock file and install test dependencies
        run: |
          poetry check --lock
          poetry install --with test --extras "tensorflow h5py"
      - name: Run tests
        run: poetry run pytest tests/

  release-verification:
    name: Security and package verification
    needs: release-gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install Poetry
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1.4.2
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true
      - name: Verify lock file and install verification dependencies
        run: |
          poetry check --lock
          poetry install --with dev --with test --extras "h5py"
      - name: Run tests
        run: poetry run pytest tests/
      - name: Check formatting
        run: poetry run black --check modelscan tests
      - name: Run strict type checks
        run: poetry run mypy --ignore-missing-imports --strict --check-untyped-defs .
      - name: Run static security analysis
        run: poetry run bandit -c pyproject.toml -r modelscan
      - name: Audit installed dependencies
        run: poetry run pip-audit --skip-editable
      - name: Scan release history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Get release version
        uses: mtkennerly/dunamai-action@9cd4531c0025990c4b81719270f328f459834d12 # v1.3.0
        with:
          env-var: MODELSCAN_VERSION
          args: --style semver --format "{base}"
      - name: Set and verify package version
        run: |
          echo "__version__ = '$MODELSCAN_VERSION'" > modelscan/_version.py
          poetry version "$MODELSCAN_VERSION"
          poetry check --lock
      - name: Build verified package artifacts
        run: poetry build
      - name: Upload verified package artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: modelscan-release
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  publish-modelscan:
    name: Publish verified artifacts
    needs: [release-tests, release-verification]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      id-token: write

    steps:
      - name: Download verified package artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: modelscan-release
          path: dist
      - name: Publish package to PyPI with trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
