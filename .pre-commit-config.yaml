default_language_version:
    python: python3
repos:
  - repo: https://github.com/psf/black
    rev: 87928e6d6761a4a6d22250e1fee5601b3998086e  # frozen: 26.5.1
    hooks:
      - id: black
  - repo: https://github.com/python-poetry/poetry
    rev: 811a12dae0fe81f199e3f1b88b8b8be9eed543c2  # frozen: 2.4.1
    hooks:
      - id: poetry-check # Makes sure poetry config is valid
      - id: poetry-lock # Makes sure lock file is up to date
        args: ["--check"]
  - repo: https://github.com/PyCQA/bandit
    rev: 92ae8b82fb422a639f0ed8d99e96cea769594e08  # frozen: 1.9.4
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml"]
        additional_dependencies: ["bandit[toml]"]
        exclude: notebooks
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: fc0f09a29bb495f4a91f00266155d6282d52485d  # frozen: v1.20.2
    hooks:
      - id: mypy
        args: ["--ignore-missing-imports", "--strict", "--check-untyped-defs"]
        additional_dependencies: ["click>=8.1.8,<9.0.0", "numpy>=1.24.3,<3.0.0", "pytest>=8.4,<10.0", "types-requests>=2.33.0.20260408,<3.0.0"]
        exclude: notebooks
